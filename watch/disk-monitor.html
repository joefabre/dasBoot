<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hard Drive Monitor</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: #2d2d2d;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .container {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                padding: 40px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(10px);
                max-width: 600px;
                width: 100%;
            }

            h1 {
                text-align: center;
                color: #333;
                margin-bottom: 30px;
                font-size: 2.5rem;
                font-weight: 700;
            }

            .disk-info {
                margin-bottom: 30px;
            }

            .disk-item {
                background: #f8f9fa;
                border-radius: 12px;
                padding: 25px;
                margin-bottom: 20px;
                border-left: 5px solid #667eea;
                transition: border-color 0.2s ease;
            }

            .disk-item.low {
                border-left-color: #28a745; /* Green for < 50% */
            }

            .disk-item.medium {
                border-left-color: #ffc107; /* Yellow for 51-70% */
            }

            .disk-item.high {
                border-left-color: #dc3545; /* Red for 71%+ */
            }

            .disk-name {
                font-size: 1.4rem;
                font-weight: 600;
                color: #333;
                margin-bottom: 15px;
            }

            .disk-stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
                margin-bottom: 20px;
            }

            .stat {
                text-align: center;
            }

            .stat-label {
                font-size: 0.9rem;
                color: #666;
                margin-bottom: 5px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .stat-value {
                font-size: 1.4rem;
                font-weight: 700;
                color: #333;
            }

            .progress-bar {
                width: 100%;
                height: 20px;
                background: #e9ecef;
                border-radius: 10px;
                overflow: hidden;
                margin-top: 15px;
            }

            .progress-fill {
                height: 100%;
                transition: width 0.2s ease, background-color 0.2s ease;
                border-radius: 10px;
            }

            .progress-fill.low {
                background-color: #28a745;
                /* Green for < 50% */
            }

            .progress-fill.medium {
                background-color: #ffc107;
                /* Yellow for 51-70% */
            }

            .progress-fill.high {
                background-color: #dc3545;
                /* Red for 71%+ */
            }

            .usage-percent {
                text-align: center;
                margin-top: 10px;
                font-weight: 600;
                font-size: 1.1rem;
            }

            .last-updated {
                text-align: center;
                color: #666;
                font-size: 0.9rem;
                margin-top: 20px;
            }

            .refresh-btn {
                display: block;
                margin: 20px auto 0;
                padding: 12px 30px;
                background: #1e3a8a;
                color: white;
                border: none;
                border-radius: 25px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .refresh-btn:hover {
                background: #1e40af;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(30, 58, 138, 0.4);
            }

            .error {
                background: #f8d7da;
                color: #721c24;
                padding: 15px;
                border-radius: 8px;
                margin: 20px 0;
                border-left: 4px solid #dc3545;
            }

            @keyframes pulse {
                0% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.7;
                }
                100% {
                    opacity: 1;
                }
            }

            .loading {
                animation: pulse 1.5s infinite;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>💾 Hard Drive Monitor</h1>
            <div id="diskinfo" class="disk-info">
                <div class="loading">Loading disk information...</div>
            </div>
            <button id="refreshbtn" class="refresh-btn">🔄 Refresh Now</button>
            <div id="lastupdated" class="last-updated"></div>
        </div>

        <script>
            class DiskMonitor {
                constructor() {
                    this.updateInterval = 500; // 0.5 seconds
                    this.intervalId = null;
                    this.init();
                }

                init() {
                    this.bindEvents();
                    this.startMonitoring();
                }

                bindEvents() {
                    document
                        .getElementById('refreshbtn')
                        .addEventListener('click', () => {
                            this.updateDiskInfo();
                        });
                }

                startMonitoring() {
                    this.updateDiskInfo();
                    this.intervalId = setInterval(() => {
                        this.updateDiskInfo();
                    }, this.updateInterval);
                }

                stopMonitoring() {
                    if (this.intervalId) {
                        clearInterval(this.intervalId);
                        this.intervalId = null;
                    }
                }

                formatBytes(bytes) {
                    if (bytes === 0) 
                        return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                }

                async getDiskInfo() {
                    // Since we can't directly access system commands from browser JavaScript,
                    // we'll simulate disk usage data. In a real implementation, you'd need
                    // a backend service or use a desktop application framework like Electron.

                    // Simulated data - replace with actual system calls in a real implementation
                    const mockDisks = [
                        {
                            name: "Macintosh HD",
                            filesystem: "/dev/disk1s1",
                            total: 500 * 1024 * 1024 * 1024, // 500GB
                            used: Math.random() * 400 * 1024 * 1024 * 1024, // Random usage up to 400GB
                            mountpoint: "/"
                        }, {
                            name: "External Drive",
                            filesystem: "/dev/disk2s1",
                            total: 1024 * 1024 * 1024 * 1024, // 1TB
                            used: Math.random() * 800 * 1024 * 1024 * 1024, // Random usage up to 800GB
                            mountpoint: "/Volumes/External"
                        }
                    ];

                    // Add some variation to simulate real-time changes
                    return mockDisks.map(disk => ({
                        ...disk,
                        used: disk.used + (Math.random() - 0.5) * 1024 * 1024 * 100, // ±100MB variation
                        available: disk.total - disk.used
                    }));
                }

                async updateDiskInfo() {
                    const diskInfoElement = document.getElementById('diskinfo');
                    const lastUpdatedElement = document.getElementById('lastupdated');

                    try {
                        const disks = await this.getDiskInfo();

                        diskInfoElement.innerHTML = disks
                            .map(disk => {
                                const usedPercent = (disk.used / disk.total * 100).toFixed(1);
                                const available = disk.total - disk.used;

                                // Determine color class based on usage percentage
                                let colorClass = 'low'; // Green for < 50%
                                if (usedPercent >= 71) {
                                    colorClass = 'high'; // Red for 71%+
                                } else if (usedPercent >= 51) {
                                    colorClass = 'medium'; // Yellow for 51-70%
                                }

                                return `
                            <div class="disk-item ${colorClass}">
                                <div class="disk-name">${disk
                                    .name}</div>
                                <div class="disk-stats">
                                    <div class="stat">
                                        <div class="stat-label">Total</div>
                                        <div class="stat-value">${this
                                    .formatBytes(disk.total)}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-label">Used</div>
                                        <div class="stat-value">${this
                                    .formatBytes(disk.used)}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-label">Available</div>
                                        <div class="stat-value">${this
                                    .formatBytes(available)}</div>
                                    </div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${colorClass}" style="width: ${usedPercent}%"></div>
                                </div>
                                <div class="usage-percent">${usedPercent}% Used</div>
                            </div>
                        `;
                            })
                            .join('');

                        lastUpdatedElement.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
                    } catch (error) {
                        diskInfoElement.innerHTML = `
                        <div class="error">
                            <strong>Error:</strong> Unable to fetch disk information. ${error.message}
                        </div>
                    `;
                    }
                }
            }

            // Initialize the disk monitor when the page loads
            document.addEventListener('DOMContentLoaded', () => {
                new DiskMonitor();
            });

            // Handle page visibility changes to pause/resume monitoring
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // Page is hidden, you might want to reduce update frequency
                    console.log('Page hidden - consider reducing update frequency');
                } else {
                    // Page is visible, resume normal monitoring
                    console.log('Page visible - resuming normal monitoring');
                }
            });
        </script>
    </body>
</html>
